<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛡️ Panel de Contrôle - Bot de Sécurité Discord</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1>🛡️ Panel de Contrôle</h1>
                <p class="subtitle">Gestion des Systèmes de Sécurité Discord</p>
            </div>
            <div class="header-stats">
                <div class="stat-card">
                    <div class="stat-value" id="totalSystems">18</div>
                    <div class="stat-label">Systèmes</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="activeSystems">0</div>
                    <div class="stat-label">Actifs</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="inactiveSystems">0</div>
                    <div class="stat-label">Inactifs</div>
                </div>
            </div>
        </header>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Rechercher un système...">
            </div>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">Tous</button>
                <button class="filter-btn" data-filter="Protection Principale">Protection Principale</button>
                <button class="filter-btn" data-filter="Protection Avancée">Protection Avancée</button>
                <button class="filter-btn" data-filter="Modération">Modération</button>
                <button class="filter-btn" data-filter="Protection Critique">Protection Critique</button>
            </div>
        </div>

        <div class="systems-grid" id="systemsGrid">
            <!-- Les systèmes seront chargés ici dynamiquement -->
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Chargement des systèmes...</p>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="app.js"></script>
</body>
</html>
