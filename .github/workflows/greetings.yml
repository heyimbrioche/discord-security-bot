name: Greetings

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: |
          Merci d'avoir ouvert cette issue ! 🎉
          
          Nous examinerons votre problème rapidement.
        pr-message: |
          Merci pour cette contribution ! 🚀
          
          Nous allons examiner votre pull request dès que possible.
